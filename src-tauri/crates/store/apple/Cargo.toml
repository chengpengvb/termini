[package]
name = "store-apple"
version = "0.1.0"
edition = "2021"

[dependencies]
store-core = { path = "../core" }
tokio = { version = "1.52.2", features = ["rt", "sync"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
