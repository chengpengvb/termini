[package]
name = "store-google"
version = "0.1.0"
edition = "2021"

[dependencies]
store-core = { path = "../core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
tokio = { version = "1.52.2", features = ["rt", "sync"] }
