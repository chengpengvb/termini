[package]
name = "code-index-bench"
version = "0.1.0"
edition = "2021"
publish = false

# 只为跑代码索引基准而存在。直接以 #[path] 引用 termini-ai 的 code_index 源文件,
# 绕开 termini-ai 里 tauri/pdfium 那条链 —— 那条链会让测试进程在 Windows 上
# 因 DLL 入口点缺失起不来(termini-ai 的 lib test 一直如此)。
[dependencies]
summer = { path = "summer-shim", package = "summer-shim" }
anyhow = "1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.5"
regex = "1.12.3"
sha2 = "0.10.9"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "blocking"] }
pdfium-render = { version = "0.9.3", features = ["thread_safe"] }
ignore = "0.4"
streaming-iterator = "0.1"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-json = "0.24.8"
tree-sitter-hcl = "1.1.0"
tree-sitter-make = "1.1.1"
