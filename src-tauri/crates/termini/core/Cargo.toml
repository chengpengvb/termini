[package]
name = "termini-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.103"
chrono = "0.4.45"
parking_lot = "0.12.5"
dashmap = "6.2.1"
tokio = { version = "1.52.2", features = ["full"] }
bytes = { version = "1.12.1", features = ["serde"] }
uuid = { version = "1.23.4", features = ["v4"] }
async-trait = "0.1.89"
summer = "0.7.1"
summer-web = { version = "0.7.3", features = ["socket_io"] }
termini-macros = { path = "../../../macros" }
russh = "0.62.2"
notify = "8.2.0"
rig = { version = "0.42.0", features = ["reqwest", "rustls", "derive", "rmcp"] }
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
sha2 = "0.10.9"
encoding_rs = "0.8"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.8.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
