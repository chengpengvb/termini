[package]
name = "termini-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.89"
parking_lot = "0.12.5"
dashmap = "6.2.1"
inventory = "0.3.24"
summer = "0.7.1"
summer-web = { version = "0.7.3", features = ["socket_io"] }
tokio = { version = "1.52.2", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tauri = { version = "2.11.5", features = [] }
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
chrono = "0.4.45"
base64 = "0.22.1"
uuid = { version = "1.23.4", features = ["v4"] }
russh = "0.62.2"
russh-sftp = "2.3.0"
suppaftp = { version = "12.1.1", default-features = false, features = ["tokio", "tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
notify = "8.2.0"
rsa = "0.9.10"
sha1 = "0.10.6"
sha2 = "0.10.9"
regex = "1.12.3"
rand = "0.8.5"
socket2 = { version = "0.6.4", features = ["all"] }
sysinfo = { version = "0.39.3", default-features = false, features = ["system", "disk"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "json", "form"] }
tauri-plugin-opener = "2"
sspi = { git = "https://github.com/chengpengvb/sspi-rs.git", default-features = false, features = ["network_client", "dns_resolver", "ring"] }
protocol-rdp = { path = "../../protocol/rdp" }
protocol-telnet = { path = "../../protocol/telnet" }
termini-core = { path = "../core" }
termini-base = { path = "../base" }
termini-platform = { path = "../platform" }
termini-macros = { path = "../../../macros" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
drag = "2.1.0"

[target.'cfg(target_os = "windows")'.dependencies]
pageant = "0.2.1"
winreg = "0.56.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
raw-window-handle = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSView",
    "NSWindow",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSFilePromiseProvider",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSDate",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSOperation",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSAutoreleasePool",
] }
