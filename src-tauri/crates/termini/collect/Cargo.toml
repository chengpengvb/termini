[package]
name = "termini-collect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
async-trait = "0.1.89"
parking_lot = "0.12.5"
dashmap = "6.2.1"
inventory = "0.3.24"
summer = "0.7.1"
tokio = { version = "1.52.2", features = ["full"] }
tokio-util = "0.7"
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
chrono = "0.4.45"
regex = "1.12.3"
sacs = "0.9.4"
rhai = { version = "1.25.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
x509-parser = "0.16"
protocol-snmp = { path = "../../protocol/snmp" }
termini-core = { path = "../core" }
termini-base = { path = "../base" }
termini-platform = { path = "../platform" }
termini-remote = { path = "../remote" }
termini-macros = { path = "../../../macros" }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
ping-async = "1.0.2"
