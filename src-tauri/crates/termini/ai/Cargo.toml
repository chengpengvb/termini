[package]
name = "termini-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
async-trait = "0.1.89"
parking_lot = "0.12.5"
dashmap = "6.2.1"
inventory = "0.3.24"
summer = "0.7.1"
summer-web = { version = "0.7.3", features = ["socket_io"] }
tokio = { version = "1.52.2", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
tauri = { version = "2.11.5", features = [] }
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "json"] }
rustls = { version = "0.23.41", features = ["ring"] }
webpki-roots = "1"
url = "2"
regex = "1.12.3"
chrono = "0.4.45"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10.9"
uuid = { version = "1.23.4", features = ["v4"] }
thiserror = "2.0.18"
encoding_rs = "0.8"
tar = "0.4.46"
flate2 = "1.1.9"
rig = { version = "0.42.0", features = ["reqwest", "rustls", "derive", "rmcp"] }
rmcp = { version = "1.8.0", default-features = false, features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
calamine = "0.36.1"
rust_xlsxwriter = "0.99.0"
docx-rust = "0.1.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
pdfium-render = { version = "0.9.3", features = ["thread_safe"] }
termini-core = { path = "../core" }
termini-base = { path = "../base" }
termini-platform = { path = "../platform" }
termini-remote = { path = "../remote" }
termini-macros = { path = "../../../macros" }
rquickjs = { version = "0.13.0", features = ["bindgen", "loader"] }

[build-dependencies]

[target.'cfg(not(target_os = "ios"))'.dependencies]
portable-pty = "0.9.0"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
ignore = "0.4"
notify = "8.2.0"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.24.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-json = "0.24.8"
tree-sitter-hcl = "1.1.0"
tree-sitter-make = "1.1.1"
streaming-iterator = "0.1"
protocol-snmp = { path = "../../protocol/snmp" }
termini-collect = { path = "../collect" }
rmcp = { version = "1.8.0", default-features = false, features = ["transport-child-process"] }
