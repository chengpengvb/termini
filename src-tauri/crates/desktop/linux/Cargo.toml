[package]
name = "desktop-linux"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
desktop-core = { path = "../core" }
# AT-SPI2 无障碍树(D-Bus)。default 已含 connection + proxies + p2p + wrappers，再开 tokio 复用主运行时
atspi = { version = "0.30", features = ["tokio"] }
zbus = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
