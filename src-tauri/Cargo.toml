[workspace]
members = ["crates/termini/*", "crates/protocol/*", "crates/protocol/rdp/encode-windows", "crates/protocol/rdp/encode-apple", "crates/protocol/rdp/encode-android", "crates/desktop/*", "crates/store/*", "crates/code-index-bench", "macros"]

[package]
name = "termini"
version = "0.1.0"
description = "Termini"
license = "GPL-3.0-only"
authors = ["chengpengvb"]
edition = "2021"

[lib]
name = "termini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.libwebp-sys]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.protocol-rdp]
opt-level = 3
incremental = false

# RDP 输出编码热路径：RGBA→NV12 + VideoToolbox，debug 下会拖到 10fps 以下
[profile.dev.package.encode-apple]
opt-level = 3

[profile.dev.package.encode-android]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.test.package.libwebp-sys]
opt-level = 3

[profile.test.package.jpeg-encoder]
opt-level = 3

[profile.test.package.protocol-rdp]
opt-level = 3
incremental = false

[profile.test.package.encode-apple]
opt-level = 3

[profile.test.package.encode-android]
opt-level = 3

[profile.test.package.yuv]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-haptics = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
encoding_rs = "0.8"

termini-macros = { path = "macros" }
termini-core = { path = "crates/termini/core" }
termini-base = { path = "crates/termini/base" }
termini-platform = { path = "crates/termini/platform" }
termini-remote = { path = "crates/termini/remote" }
termini-ai = { path = "crates/termini/ai" }
protocol-rdp = { path = "crates/protocol/rdp" }
protocol-telnet = { path = "crates/protocol/telnet" }
store-core = { path = "crates/store/core" }
store-apple = { path = "crates/store/apple" }
store-microsoft = { path = "crates/store/microsoft" }
store-google = { path = "crates/store/google" }


summer = "0.7.1"
inventory = "0.3.24"
summer-web = { version = "0.7.3", features = ["socket_io"] }

tokio = { version = "1.52.2", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
socket2 = { version = "0.6.4", features = ["all"] }
async-trait = "0.1.89"

russh = "0.62.2"
russh-sftp = "2.3.0"
sspi = { git = "https://github.com/chengpengvb/sspi-rs.git", default-features = false, features = ["network_client", "dns_resolver", "ring"] }

anyhow = "1.0.103"
parking_lot = "0.12.5"
dashmap = "6.2.1"
sacs = "0.9.4"
regex = "1.12.3"
rhai = { version = "1.25.1", features = ["sync"] }
sha2 = "0.10.9"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
rand = "0.8.5"
uuid = { version = "1.23.4", features = ["v4"] }

bytes = { version = "1.12.1", features = ["serde"] }
chrono = "0.4.45"
iana-time-zone = "0.1.65"
md4 = "0.10.2"
md-5 = "0.10.6"
sha1 = "0.10.6"
hmac = "0.12.1"
rc4 = "0.1.0"
rsa = "0.9.10"
num-bigint = "0.4.8"
rustls = { version = "0.23.41", features = ["ring"] }
tokio-rustls = "0.26.4"
rustls-pki-types = "1"
rodio = { version = "0.20", default-features = false }

rig = { version = "0.42.0", features = ["reqwest", "rustls", "derive", "rmcp"] }
rmcp = { version = "1.8.0", default-features = false, features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "json"] }
url = "2"
sea-orm = { version = "1.1.20", features = ["macros", "sqlx-sqlite", "runtime-tokio-rustls"] }
flate2 = "1.1.9"
thiserror = "2.0.18"
notify = "8.2.0"
ignore = "0.4"
raw-window-handle = "0.6.2"
sysinfo = { version = "0.39.3", default-features = false, features = ["system", "disk"] }
dhat = { version = "0.3.3", optional = true }
tauri-plugin-deep-link = "2.4.9"
calamine = "0.36.1"
rust_xlsxwriter = "0.99.0"
docx-rust = "0.1.11"
tar = "0.4.46"
pdfium-render = { version = "0.9.3", features = ["thread_safe"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSView",
    "NSWindow",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSFilePromiseProvider",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSError",
    "NSGeometry",
    "NSObject",
    "NSOperation",
    "NSRunLoop",
    "NSString",
    "NSURL",
] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
portable-pty = "0.9.0"

# iOS: disable WKWebView automatic safe-area content insets (bottom band / home-indicator gap).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-ios-webview-insets = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["image"] }
ping-async = "1.0.2"
drag = "2.1.0"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
termini-collect = { path = "crates/termini/collect" }
rmcp = { version = "1.8.0", default-features = false, features = ["transport-child-process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1", features = ["x11"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
dhat = ["dep:dhat"]
mas = ["termini-platform/mas"]

[dev-dependencies]
rand10 = { package = "rand", version = "0.10" }

# rig 0.42.0 fork：诊断 Null→{}、arguments 序列化 Null→"{}"、流式 images、rustls-no-provider
[patch.crates-io]
rig-core = { git = "https://github.com/chengpengvb/rig-core.git" }
rig-agent = { git = "https://github.com/chengpengvb/rig-agent.git" }

