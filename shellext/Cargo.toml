[package]
name = "termini-shellext"
version = "0.1.0"
edition = "2021"

[lib]
name = "shellext"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
